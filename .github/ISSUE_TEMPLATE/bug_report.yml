name: Bug Report
description: File a bug report or unexpected runtime error in BioOS Core.
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting an issue in BioOS Core. Please fill out the sections below.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or payload to reproduce the behavior.
      placeholder: |
        1. Ingest payload ...
        2. Execute handler ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Apps Script V8 runtime version or Node.js version.
      placeholder: e.g., Node v20.11.0 / Apps Script V8
    validations:
      required: false
